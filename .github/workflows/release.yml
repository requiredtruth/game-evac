name: Validate and release HTML game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rules.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/game-evac.html
          cp spec.md dist/spec.md
          git archive --format=zip HEAD -o dist/source.zip
          cd dist
          sha256sum game-evac.html spec.md source.zip > SHA256SUMS.txt
          TAG="v0.1.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" game-evac.html spec.md source.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "EVAC: ASHFALL $TAG" --notes-file ../md/RELEASE_NOTES.md
